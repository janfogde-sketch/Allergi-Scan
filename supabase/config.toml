# Supabase CLI-projektkonfiguration.
# Kør `supabase link --project-ref jegrpcflyguadyxialkm` lokalt for at
# forbinde denne repo-checkout til det rigtige Supabase-projekt (kræver
# `supabase login` med din egen konto først).
project_id = "jegrpcflyguadyxialkm"

# verify_jwt pr. funktion, som i produktion 30. sept. 2026. GitHub-
# workflowet .github/workflows/deploy-edge-functions.yml deployer herfra,
# og en funktion, der ikke står her, får CLI'ens standard (true).
#
# false: funktionen laver selv sit auth-tjek (se
# .claude/rules/edge-function-auth.md). Slået fra pga. ES256-
# inkompatibilitet, se CONTEXT.md afsnit 2.

[functions.admin]
verify_jwt = false

[functions.admin-digest]
verify_jwt = false

[functions.allergens]
verify_jwt = false

[functions.auto-import-off]
verify_jwt = false

[functions.favorites]
verify_jwt = false

[functions.family]
verify_jwt = false

[functions.family-invite]
verify_jwt = false

[functions.feedback]
verify_jwt = false

[functions.history]
verify_jwt = false

[functions.ocr]
verify_jwt = false

[functions.products]
verify_jwt = false

[functions.search]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.shopping]
verify_jwt = false

[functions.submissions]
verify_jwt = false

[functions.cleanup-orphan-images]
verify_jwt = false

[functions.inactive-accounts]
verify_jwt = false

[functions.weekly-digest]
verify_jwt = false

# true: Supabase tjekker JWT før funktionen kaldes.

[functions.auto-reparse]
verify_jwt = true

[functions.classify-categories]
verify_jwt = true

[functions.delete-user]
verify_jwt = true

[functions.food-waste]
verify_jwt = true

[functions.send-push]
verify_jwt = true

# Kategori 4: kun service-role (cron). Tjekker nøglen selv i koden.
[functions.notify]
verify_jwt = false

# Kategori 2: login + admin-rolle tjekkes i funktionen (testafsendelse fra admin → Notifikationer).
[functions.notify-test]
verify_jwt = false

# Kategori 4: kun service-role (cron sync_recalls). Tjekker nøglen selv i koden.
[functions.recalls-sync]
verify_jwt = false

# Signeret webhook (Supabase Auths Send Email Hook): Auth sender ingen bruger-JWT; funktionen kontrollerer
# Standard Webhooks-signaturen med SEND_EMAIL_HOOK_SECRET i koden.
[functions.auth-send-email]
verify_jwt = false

# Signeret token-link ("Det var ikke mig" i glemt-adgangskode-mailen): ingen bruger-JWT; funktionen kontrollerer
# HMAC-signatur og udløb (_shared/reportLink.ts) før noget læses eller skrives.
[functions.report-unrequested-reset]
verify_jwt = false

# Engangs-genanalyse af produkters allergenflag (fase 2 K4): kræver admin-JWT eller service-role (tjekkes i funktionen).
[functions.allergen-reanalyze]
verify_jwt = true
