# Månedlig prøve-gendannelse: beviser, at den nyeste kopi kan åbnes og indeholder data (Jan, 14. okt. 2026).
# Skabelon til det PRIVATE arkiv (.github/workflows/restore-test.yml). Fejler kørslen, sender GitHub en fejlmail til arkivets ejer.
name: Prøve-gendannelse

on:
  schedule:
    - cron: "0 5 1 * *" # den 1. hver måned
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
      PGPASSWORD: test
    steps:
      - name: Tjek opsætning
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Mangler secret BACKUP_PASSPHRASE. Se docs/natlig-backup.md i Allergi-Scan."
            exit 1
          fi

      - name: Installer PostgreSQL-klient 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Runneren har ældre pg_dump/pg_restore først i PATH; Supabase kører Postgres 17.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Hent nyeste kopi
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Ingen vellykket sikkerhedskopi at teste (ældre end 7 dage er slettet)."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir kopi
          ls -lR kopi

      - name: Lås op og gendan i testdatabase
        run: |
          set -euo pipefail
          umask 077
          f=$(ls kopi/*/*.gpg | head -1)
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --decrypt \
            --passphrase-fd 0 --output dump.pgdump "$f"
          psql -h localhost -U postgres -c 'create schema if not exists extensions' postgres
          # Rolle- og udvidelsesfejl fra Supabase-skemaer forventes og ignoreres; rækketællingen nedenfor er beviset.
          pg_restore -h localhost -U postgres -d postgres --no-owner --no-privileges dump.pgdump 2> restore.log || true
          echo "Antal fejllinjer i gendannelsen: $(grep -c 'error' restore.log || true)"

      - name: Tæl rækker
        run: |
          set -euo pipefail
          fail=0
          for t in public.users public.user_allergens public.products; do
            n=$(psql -h localhost -U postgres -tA -c "select count(*) from $t" postgres 2>/dev/null || echo "fejl")
            echo "$t: $n"
            case "$n" in ''|fejl|0) fail=1 ;; esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Prøve-gendannelsen mislykkedes: en tabel mangler eller er tom. Se log ovenfor."
            tail -n 40 restore.log
            exit 1
          fi
          echo "Prøve-gendannelsen virker."
