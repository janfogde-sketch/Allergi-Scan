name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main] # dev testes i selve PR'en; ved "udgiv" testes PR'en dev -> main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # CLAUDE.md holdes under 15 KB (se CLAUDE.md, regel øverst). Tjekket kører også på dokumentændringer.
      - name: CLAUDE.md er under 15 KB
        run: |
          size=$(wc -c < CLAUDE.md)
          echo "CLAUDE.md er $size bytes"
          if [ "$size" -ge 15000 ]; then
            echo "CLAUDE.md er for stor ($size bytes, grænsen er 15000). Flyt detaljer til en fil i docs/."
            exit 1
          fi

      # Flyttet hertil fra "Tjek efter merge" 15. okt. 2026 (sparer en maskine pr. kørsel).
      - name: Ødelagte danske tegn (kyrilliske tegn i stedet for æ/ø/å)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          exts = (".js", ".jsx", ".ts", ".tsx", ".json", ".md", ".html", ".css", ".sql", ".toml", ".yml", ".yaml", ".txt")
          bad = 0
          for p in files:
              if not p.endswith(exts):
                  continue
              try:
                  text = open(p, encoding="utf-8").read()
              except (UnicodeDecodeError, FileNotFoundError):
                  continue
              for m in re.finditer(r"[Ѐ-ӿ]{2,}", text):
                  line = text.count("\n", 0, m.start()) + 1
                  print(f"::error file={p},line={line}::Mulig tegnfejl: {m.group()}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      # Rene to do-/dokumentændringer (se changed-scope.sh) springer de tunge trin over; jobbet består stadig,
      # så det kan være påkrævet i GitHub. Ved tvivl kører alt som før.
      - name: Rører ændringen kun to do, dokumenter eller Claude-filer?
        id: scope
        run: .github/scripts/changed-scope.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - if: steps.scope.outputs.only_docs != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - if: steps.scope.outputs.only_docs != 'true'
        run: npm ci

      - if: steps.scope.outputs.only_docs != 'true'
        name: Lint
        run: npm run lint

      - if: steps.scope.outputs.only_docs != 'true'
        name: Typetjek (kernefiler, se tsconfig.check.json)
        run: npm run typecheck

      - if: steps.scope.outputs.only_docs != 'true'
        name: Test
        run: npm test

      - if: steps.scope.outputs.only_docs != 'true'
        name: Build
        run: npm run build
