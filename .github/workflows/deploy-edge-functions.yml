# Deployer Supabase Edge Functions fra repoet (arkitektur-audit A6,
# 30. sept. 2026).
#
# Ved merge til main deployes KUN de funktioner, hvis filer er ændret —
# inkl. funktioner, der importerer en ændret fil i supabase/functions/_shared.
# Man kan også starte workflowet manuelt under Actions og angive navne
# (kommasepareret) eller "all". Ændres kun verify_jwt i supabase/config.toml,
# skal den berørte funktion deployes manuelt på den måde.
#
# Kræver GitHub-secret SUPABASE_ACCESS_TOKEN (personligt access token fra
# supabase.com/dashboard/account/tokens). Mangler den, springes deploy over
# med en besked i loggen, uden at workflowet fejler.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      functions:
        description: 'Funktioner der skal deployes (kommasepareret), eller "all"'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jegrpcflyguadyxialkm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find funktioner der skal deployes
        id: pick
        env:
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -printf '%f\n' | sort)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_FUNCTIONS" = "all" ]; then
              picked="$all"
            else
              picked=$(echo "$INPUT_FUNCTIONS" | tr ',' '\n' | sed 's/ //g' | grep -v '^$' || true)
            fi
          else
            base="$BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
            changed=$(git diff --name-only "$base" HEAD -- supabase/functions)
            echo "Ændrede filer:"; echo "$changed"
            picked=$(echo "$changed" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | grep -v '^_shared$' || true)
            # Funktioner, der importerer en ændret _shared-fil
            for f in $(echo "$changed" | sed -n 's#^supabase/functions/_shared/\(.*\)#\1#p'); do
              users=$(grep -rl --include='*.ts' --include='*.js' "_shared/$f" supabase/functions | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | grep -v '^_shared$' || true)
              picked=$(printf '%s\n%s\n' "$picked" "$users")
            done
          fi

          # Kun funktioner, der faktisk findes som mappe
          picked=$(echo "$picked" | grep -v '^$' | sort -u | while read -r fn; do
            if echo "$all" | grep -qx "$fn"; then echo "$fn"; else echo "Springer over ukendt funktion: $fn" >&2; fi
          done)
          echo "Deployes: ${picked:-(ingen)}"
          echo "list=$(echo $picked)" >> "$GITHUB_OUTPUT"

      - name: Tjek at secret findes
        id: secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN mangler — deploy springes over. Se .github/workflows/deploy-edge-functions.yml."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.list != '' && steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Kør tests før deploy
        if: steps.pick.outputs.list != '' && steps.secret.outputs.ok == 'true'
        run: |
          npm ci
          npx vitest run

      - uses: supabase/setup-cli@v1
        if: steps.pick.outputs.list != '' && steps.secret.outputs.ok == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.list != '' && steps.secret.outputs.ok == 'true'
        run: |
          set -euo pipefail
          for fn in ${{ steps.pick.outputs.list }}; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
