# Natjob-tråden henter køen (Jan, 14. okt. 2026; docs/natjob-routine.md). Læser kun; skriver intet.
# Køres af den faste tråd med GitHub-værktøjet "actions_run_trigger" (eller manuelt: Actions > Hent natjob-kø > Run workflow).
name: Hent natjob-kø

on:
  workflow_dispatch:

concurrency:
  group: natjob
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hent:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jegrpcflyguadyxialkm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Hent køen og kør motorens nøgleord
        run: .github/scripts/natjob.sh hent
