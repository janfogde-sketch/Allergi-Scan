# Anvender nye databasemigrationer fra supabase/migrations ved merge til main.
# Jans "push" (godkend + squash-merge) er den eneste godkendelse; ingen dialoger.
# Kun filer nyere end CUTOFF i .github/scripts/apply-migrations.sh og som ikke
# allerede står i databasens historik, køres (hver i sin egen transaktion).
# Manuelt: Actions > "Apply migrations" > Run workflow, evt. med dry_run.
# Kræver GitHub-secret SUPABASE_ACCESS_TOKEN (samme som edge-funktionerne).
name: Apply migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Vis kun, hvad der ville blive kørt"
        type: boolean
        default: true

concurrency:
  group: apply-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jegrpcflyguadyxialkm
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tjek at secret findes
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN mangler - migrationer er IKKE anvendt."; exit 1
          fi
      - name: Anvend nye migrationer
        run: .github/scripts/apply-migrations.sh
