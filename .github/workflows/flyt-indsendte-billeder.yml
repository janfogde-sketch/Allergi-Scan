# Engangsflytning af indsendte fotos til den private bøtte (plan-private-emballagefotos, Jans ja 14. okt. 2026).
# Kør først med dry_run og se listen; derefter apply. Kan slettes, når flytningen er bekræftet.
name: Flyt indsendte billeder

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run (kun visning) eller apply (flyt)"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, apply]

permissions:
  contents: read

jobs:
  flyt:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jegrpcflyguadyxialkm
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Flyt
        run: node scripts/flyt-indsendte-billeder.mjs
