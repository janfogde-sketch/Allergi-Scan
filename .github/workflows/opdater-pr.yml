name: Opdater PR'er der er bagud

# main kræver, at en PR er opdateret med main, før den merges (beskytter migrationsnumrene).
# Når en PR går ind, kommer alle andre PR'er med automatisk merge "bagud". Denne kørsel opdaterer dem selv
# og starter tjekkene på den nye version. Uden den ville de stå stille, til nogen opdaterede dem i hånden.
# Opdatering med GITHUB_TOKEN starter ikke tjekkene af sig selv (GitHubs regel mod uendelige løkker).
# PR'ens egne kørsler står derfor som "action_required"; dem genkører vi bagefter, så de påkrævede tjek bliver grønne på selve PR'en.
# workflow_dispatch-kopierne tæller ikke for regelsættet og er kun en ekstra sikkerhed. Ingen ekstra nøgle nødvendig.
# En PR med konflikt rører vi ikke: ejeren skal flette main ind (CLAUDE.md afsnit 4).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *" # sikkerhedsnet, hvis en kørsel ved push blev misset
  workflow_dispatch:

concurrency:
  group: opdater-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  opdater:
    name: Opdater PR'er med automatisk merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Opdater og start tjek
        run: |
          set -u
          # GitHub regner en PRs status ud i baggrunden; kort pause efter et push til main giver et rigtigt svar.
          [ "${{ github.event_name }}" = "push" ] && sleep 20
          for nr in $(gh pr list -R "$REPO" --state open --base main --json number,isDraft,isCrossRepository,autoMergeRequest \
              --jq '.[] | select(.autoMergeRequest != null and .isDraft == false and .isCrossRepository == false) | .number'); do
            state=$(gh pr view "$nr" -R "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$state" = "UNKNOWN" ]; then sleep 15; state=$(gh pr view "$nr" -R "$REPO" --json mergeStateStatus --jq .mergeStateStatus); fi
            if [ "$state" = "DIRTY" ]; then echo "PR #$nr har konflikt: ejeren skal flette main ind."; continue; fi
            [ "$state" = "BEHIND" ] || { echo "PR #$nr: $state, intet at gøre."; continue; }

            echo "PR #$nr er bagud: opdaterer."
            gh api -X PUT "repos/$REPO/pulls/$nr/update-branch" --silent || { echo "::warning::Kunne ikke opdatere PR #$nr"; continue; }
            sleep 5
            ref=$(gh pr view "$nr" -R "$REPO" --json headRefName --jq .headRefName)
            sha=$(gh pr view "$nr" -R "$REPO" --json headRefOid --jq .headRefOid)
            # Vent op til ~90 sek. på, at PR'ens egne kørsler dukker op, og genkør dem, der står som "action_required".
            for _ in 1 2 3 4 5 6; do
              ids=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=50" \
                --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
              [ -n "$ids" ] && break
              sleep 15
            done
            for id in $ids; do
              echo "PR #$nr: kørsel $id står som action_required, genkører."
              gh run rerun "$id" -R "$REPO" || echo "::warning::Kunne ikke genkøre kørsel $id for PR #$nr"
            done
            gh workflow run migration-versions.yml -R "$REPO" --ref "$ref"
            gh workflow run ci.yml -R "$REPO" --ref "$ref"
            gh workflow run post-merge-checks.yml -R "$REPO" --ref "$ref"
            # DB-tests er tunge: kun hvis PR'en rører migrationer eller tests (som db-tests.yml selv skriver).
            if gh pr diff "$nr" -R "$REPO" --name-only | grep -qE '^(supabase/migrations/|supabase/tests/|supabase/functions/delete-user/|\.github/workflows/db-tests\.yml)'; then
              gh workflow run db-tests.yml -R "$REPO" --ref "$ref"
            fi
          done
