name: Klik-tests

# Automatiske klik-tests (Playwright) af appens hovedveje, se e2e/. Kører mod det byggede site med en forfalsket backend.
# Viser kun fejl: tjekket er IKKE påkrævet i GitHub og stopper ikke merge (Jan, 14. okt. 2026).
on:
  pull_request:
    paths-ignore: ["docs/**", ".claude/**", "supabase/migrations/**", "supabase/tests/**", "supabase/todo/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".claude/**", "supabase/migrations/**", "supabase/tests/**", "supabase/todo/**", "**/*.md"]
  workflow_dispatch:

jobs:
  klik-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Klik-tests
        run: npm run test:e2e

      - name: Gem rapport ved fejl
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klik-test-rapport
          path: |
            playwright-report
            test-results
          retention-days: 7
