name: DB-tests

# Bygger en tom Postgres ud fra supabase/migrations/ og kører SQL-tests i supabase/tests/.
# Rører aldrig produktion (kører på en midlertidig kopi på GitHub-maskinen). Kræver ikke Supabase Pro.
on:
  pull_request:
    paths: ["supabase/migrations/**", "supabase/tests/**", "supabase/functions/delete-user/**", ".github/workflows/db-tests.yml"]
  push:
    branches: [main, dev]
    paths: ["supabase/migrations/**", "supabase/tests/**", "supabase/functions/delete-user/**", ".github/workflows/db-tests.yml"]

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Start lokal Supabase og afspil alle migrationer
        run: supabase start -x studio,imgproxy,logflare,vector,mailpit,edge-runtime,supavisor

      - name: Kør SQL-tests
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          for f in supabase/tests/*.sql; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
