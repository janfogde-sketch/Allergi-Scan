name: Tjek efter merge

# Pakketjek og typetjek af serverfunktioner. En rød kørsel betyder, at noget skal rettes.
# Lint, tests, build og tegn-tjek ligger i ci.yml.

on:
  # Kun når serverfunktioner eller pakker ændres (Jan 15. okt. 2026: færre testminutter, se docs/arbejdsgang.md).
  # Tegn-tjekket ligger i CI; dækningsrapporten og pakketjekket kører også én gang om ugen.
  push:
    branches: [main]
    paths: ["supabase/functions/**", "package.json", "package-lock.json", ".github/workflows/post-merge-checks.yml"]
  pull_request:
    branches: [main]
    paths: ["supabase/functions/**", "package.json", "package-lock.json", ".github/workflows/post-merge-checks.yml"]
  schedule:
    - cron: "0 5 * * 1" # mandag 07:00 dansk tid
  workflow_dispatch:

jobs:
  pakker:
    name: Sikkerhedshuller i pakker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Alvorlige huller i det, brugerne får (fejler)
        run: npm audit --omit=dev --audit-level=high
      - name: Alle pakker inkl. byggeværktøj (kun advarsel)
        run: npm audit || echo "::warning::Hul i byggeværktøj, se loggen (rammer ikke brugerne)"

  serverfunktioner:
    name: Tjek af serverfunktioner
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Typetjekket hang 15. okt. 2026 (hentning af pakker) og blokerede en PR i over 10 min.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Findes alt, og passer typerne? (fejler)
        run: |
          set -u
          fail=0
          for f in supabase/functions/*/index.ts; do
            out=$(NO_COLOR=1 deno check --node-modules-dir=none "$f" 2>&1) && continue
            echo "::error file=$f::Typefejl eller manglende fil"; echo "$out" | tail -25; fail=1
          done
          exit $fail

  daekning:
    name: Dækningsrapport
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kør tests med dækning (kun information)
        run: |
          npm i --no-save "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
          npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=text | tee coverage.txt
          { echo "### Testdækning"; echo '```'; grep -A5 "Coverage summary" coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
