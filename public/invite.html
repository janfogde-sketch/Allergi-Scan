<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EatSafe — Familie-invitation</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root{
      --ink:#15201A; --ink2:rgba(21,32,26,.78); --muted:rgba(21,32,26,.58);
      --paper:#F6F8F3; --green:#178A50; --green-lt:rgba(23,138,80,.10); --green-mid:rgba(23,138,80,.18);
      --surface:#FFFFFF; --surface2:#F1F3EC; --border:rgba(21,32,26,.10); --border2:rgba(21,32,26,.16);
      --red:#C8402E; --f:'DM Sans',system-ui,-apple-system,sans-serif;
    }
    body {
      font-family: var(--f);
      background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px 28px;
      max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 8px -2px rgba(21,32,26,.10);
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--green); letter-spacing: -.3px; margin-bottom: 24px; }
    .logo span { color: var(--ink); }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 900; color: var(--ink); letter-spacing: -.4px; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: block; width: 100%; padding: 15px;
      background: var(--green); color: #fff;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none;
      margin-bottom: 10px;
    }
    .btn:hover { background: #146e40; }
    .btn-ghost {
      background: var(--surface); color: var(--ink2);
      border: 1.5px solid var(--border2); font-size: 13px;
      font-weight: 700; padding: 13px;
    }
    .btn-ghost:hover { background: var(--surface2); }
    .error { color: var(--red); font-size: 13px; margin-top: 12px; }
    .success { color: var(--green); font-size: 14px; font-weight: 700; margin-top: 12px; }
    .spinner {
      width: 30px; height: 30px; border: 3px solid var(--border2);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">Eat<span>Safe</span></div>
    <div class="spinner" id="spinner"></div>
    <div id="content" style="display:none"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://jegrpcflyguadyxialkm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZ3JwY2ZseWd1YWR5eGlhbGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjY5NjQsImV4cCI6MjA5NDc0Mjk2NH0.QErfbw2xmsdYjTZCS1WUOUwQHv6G2PKQRldyj8rdGq8";

    const token = window.location.pathname.split("/invite/")[1]?.split("/")[0];
    const spinner = document.getElementById("spinner");
    const content = document.getElementById("content");

    function show(html) {
      spinner.style.display = "none";
      content.style.display = "block";
      content.innerHTML = html;
    }

    async function checkToken() {
      if (!token) {
        show(`
          <div class="icon">❌</div>
          <h1>Ugyldigt link</h1>
          <p>Dette invitationslink er ikke gyldigt.</p>
          <a href="https://eatsafe.dk" class="btn">Gå til EatSafe</a>
        `);
        return;
      }

      // Tjek om token eksisterer og er gyldigt
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/family_invites?token=eq.${token}&select=status,expires_at,invited_by`,
          { headers: { "apikey": SUPABASE_ANON_KEY } }
        );
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          show(`
            <div class="icon">❌</div>
            <h1>Ugyldigt link</h1>
            <p>Dette invitationslink findes ikke.</p>
            <a href="https://eatsafe.dk" class="btn">Gå til EatSafe</a>
          `);
          return;
        }

        const invite = data[0];
        if (invite.status === "accepted") {
          show(`
            <div class="icon">✅</div>
            <h1>Allerede accepteret</h1>
            <p>Dette invitationslink er allerede brugt.</p>
            <a href="https://eatsafe.dk" class="btn">Åbn EatSafe</a>
          `);
          return;
        }

        if (invite.status !== "pending" || new Date(invite.expires_at) < new Date()) {
          show(`
            <div class="icon">⏱</div>
            <h1>Linket er udløbet</h1>
            <p>Bed familiemedlemmet om at sende et nyt invitationslink.</p>
            <a href="https://eatsafe.dk" class="btn">Gå til EatSafe</a>
          `);
          return;
        }

        // Gyldigt link — vis accept-flow
        show(`
          <div class="icon">👨‍👩‍👧</div>
          <h1>Du er inviteret!</h1>
          <p>Et EatSafe-familiemedlem har inviteret dig til at dele allergiprofiler. Opret en konto for at acceptere.</p>
          <a href="https://eatsafe.dk?invite=${token}" class="btn">Acceptér og opret konto</a>
          <a href="https://eatsafe.dk?invite=${token}&login=1" class="btn btn-ghost">Jeg har allerede en konto</a>
          <p style="font-size:12px; margin-top:16px; color:var(--muted)">
            Invitationen udløber ${new Date(invite.expires_at).toLocaleDateString("da-DK")}
          </p>
        `);
      } catch {
        show(`
          <div class="icon">⚠️</div>
          <h1>Noget gik galt</h1>
          <p>Tjek din internetforbindelse og prøv igen.</p>
          <a href="https://eatsafe.dk" class="btn">Gå til EatSafe</a>
        `);
      }
    }

    checkToken();
  </script>
</body>
</html>
