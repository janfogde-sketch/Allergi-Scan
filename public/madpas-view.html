<!DOCTYPE html>

    :root{

      padding: 0 0 40px;

    #app { max-width: 480px; margin: 0 auto; padding: 0 20px; }
    .top { display:flex; align-items:center; justify-content:space-between; padding:18px 0 10px; }
    .logo { font-size: 16px; font-weight: 800; color: var(--green); letter-spacing:-.2px; }
    .logo span { color: var(--ink); }
    .lang-select {

      background:var(--surface); border-radius:100px; padding:8px 32px 8px 12px;
      font-family:var(--f); font-size:13px; font-weight:700; color:var(--ink);
      cursor:pointer;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%2315201A' stroke-width='1.5' fill='none'/></svg>");
      background-repeat:no-repeat; background-position:right 12px center;
    }
    .hero { text-align:center; padding: 18px 0 22px; }
    .hero-flag { font-size:56px; line-height:1; margin-bottom:10px; }
    .hero-lang { font-size:15px; font-weight:700; color:var(--muted); }
    .hero-name { font-size:22px; font-weight:900; letter-spacing:-.4px; margin-top:6px; }
    .section { margin-bottom:22px; }
    .section-lbl { font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:10px; }
    .headline { font-size:15px; font-weight:700; color:var(--ink); margin-bottom:10px; }
    .item-row { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .item-row:last-child { border-bottom:none; }
    .item-emoji { font-size:26px; flex-shrink:0; }
    .item-name { font-size:20px; font-weight:800; color:var(--ink); }
    .item-examples { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.4; }
    .safety-note { font-size:14px; color:var(--ink2); margin-top:10px; line-height:1.5; font-weight:600; }
    .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:8px 14px; border-radius:100px; font-size:14px; font-weight:700; background:var(--green-selected-bg); border:1px solid var(--border); color:var(--ink2); }
    .chip.enumber { background:var(--surface2); }
    .footer { text-align:center; font-size:11px; color:var(--muted); margin-top:32px; padding-top:16px; border-top:1px solid var(--border); }
    .state-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 24px; text-align:center; margin-top:60px; }
    .state-icon { font-size:40px; margin-bottom:14px; }
    .state-title { font-size:18px; font-weight:800; margin-bottom:8px; }
    .state-text { font-size:13px; color:var(--muted); line-height:1.6; }
    .spinner { width:28px; height:28px; border:3px solid var(--border2); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; margin:80px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>

    const token = window.location.pathname.split("/madpas/")[1]?.split("/")[0];
    const content = document.getElementById("content");

    function allergenLabel(a, lang) {
      if (lang === "da") return a.label;
      return (DATA.ALLERGEN_T[a.id] && DATA.ALLERGEN_T[a.id][lang]) || (DATA.ALLERGEN_T[a.id] && DATA.ALLERGEN_T[a.id].en) || a.label;
    }
    function dietLabel(id, lang) {
      const d = DATA.DIETS.find(x => x.id === id);
      if (!d) return null;
      if (lang === "da") return d.label;
      return (DATA.DIET_T[id] && DATA.DIET_T[id][lang]) || (DATA.DIET_T[id] && DATA.DIET_T[id].en) || d.label;
    }
    function section(id, lang) { return DATA.MADPAS_SECTIONS_T[id][lang] || DATA.MADPAS_SECTIONS_T[id].en; }
    function allergenExamples(a, lang) {
      const ex = DATA.ALLERGEN_EXAMPLES[a.id];
      if (!ex) return [];
      const products = (ex.products && ex.products[lang]) || (ex.products && ex.products.en) || [];
      const ingredients = (ex.ingredients && ex.ingredients[lang]) || (ex.ingredients && ex.ingredients.en) || [];
      return [...products, ...ingredients].slice(0, 4);
    }
    function examplesLine(a, lang) {
      const examples = allergenExamples(a, lang);
      if (examples.length === 0) return "";
      const label = DATA.MADPAS_EXAMPLES_LABEL_T[lang] || DATA.MADPAS_EXAMPLES_LABEL_T.en;
      return `<div class="item-examples"><strong>${escapeHtml(label)}</strong> ${escapeHtml(examples.join(" · "))}</div>`;
    }

    function renderPassport(passport, lang) {
      const langInfo = DATA.MADPAS_LANGUAGES.find(l => l.code === lang) || DATA.MADPAS_LANGUAGES[1];
      document.documentElement.dir = langInfo.rtl ? "rtl" : "ltr";

      const allergenItems = (passport.allergens || []).map(id => DATA.ALLERGENS.find(a => a.id === id)).filter(Boolean);
      const allergyItems = allergenItems.filter(a => a.type === "allergi");
      const intoleranceItems = allergenItems.filter(a => a.type === "intolerance");
      const customItems = (passport.custom || []);
      const dietItems = (passport.diets || []).map(id => ({ id, label: dietLabel(id, lang) })).filter(x => x.label);
      const eNumberItems = passport.eNumbers || [];

      let html = "";
      html += `<div class="hero">
        <div class="hero-flag">${langInfo.flag}</div>
        <div class="hero-lang">${langInfo.name}</div>
        ${passport.name ? `<div class="hero-name">${escapeHtml(passport.name)}</div>` : ""}
      </div>`;

      if (allergyItems.length > 0 || customItems.length > 0) {
        html += `<div class="section">
          <div class="section-lbl">${section("allergies", lang)}</div>
          <div class="headline">${DATA.MADPAS_ALLERGY_HEADLINE_T[lang] || DATA.MADPAS_ALLERGY_HEADLINE_T.en}</div>
          <div>`;
        allergyItems.forEach(a => {
          html += `<div class="item-row"><span class="item-emoji">${a.emoji}</span><div><span class="item-name">${escapeHtml(allergenLabel(a, lang))}</span>${examplesLine(a, lang)}</div></div>`;
        });
        customItems.forEach(c => {
          html += `<div class="item-row"><span class="item-emoji">⚠️</span><span class="item-name">${escapeHtml(c)}</span></div>`;
        });
        html += `</div>
          <div class="safety-note">${DATA.MADPAS_SAFETY_NOTE_T[lang] || DATA.MADPAS_SAFETY_NOTE_T.en}</div>
        </div>`;
      }

      if (intoleranceItems.length > 0) {
        html += `<div class="section">
          <div class="section-lbl">${section("intolerances", lang)}</div>
          <div class="headline">${DATA.MADPAS_INTOLERANCE_HEADLINE_T[lang] || DATA.MADPAS_INTOLERANCE_HEADLINE_T.en}</div>
          <div>`;
        intoleranceItems.forEach(a => {
          html += `<div class="item-row"><span class="item-emoji">${a.emoji}</span><div><span class="item-name">${escapeHtml(allergenLabel(a, lang))}</span>${examplesLine(a, lang)}</div></div>`;
        });
        html += `</div></div>`;
      }

      if (dietItems.length > 0) {
        html += `<div class="section">
          <div class="section-lbl">${section("diet", lang)}</div>
          <div class="chip-row">`;
        dietItems.forEach(d => { html += `<div class="chip">${escapeHtml(d.label)}</div>`; });
        html += `</div></div>`;
      }

      if (eNumberItems.length > 0) {
        html += `<div class="section">
          <div class="section-lbl">${section("enumbers", lang)}</div>
          <div class="chip-row">`;
        eNumberItems.forEach(e => { html += `<div class="chip enumber">${escapeHtml(e)}</div>`; });
        html += `</div></div>`;
      }

      html += `<div class="footer">EatSafe · eatsafe.dk · ${new Date().toLocaleDateString(langInfo.bcp)}</div>`;
      content.innerHTML = html;
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = String(s);
      return d.innerHTML;
    }

    function renderLangSelect(currentLang, onChange) {
      const sel = document.createElement("select");
      sel.className = "lang-select";
      DATA.MADPAS_LANGUAGES.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.code;
        opt.textContent = `${l.flag} ${l.name}`;
        if (l.code === currentLang) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", e => onChange(e.target.value));
      langSlot.innerHTML = "";
      langSlot.appendChild(sel);
    }

    function showState(icon, title, text) {
      content.innerHTML = `<div class="state-card">
        <div class="state-icon">${icon}</div>
        <div class="state-title">${escapeHtml(title)}</div>
        <div class="state-text">${escapeHtml(text)}</div>
      </div>`;
    }

    (async () => {
      if (!token) {
        showState("❌", "Invalid link", "This meal passport link is not valid.");
        return;
      }
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_madpas_by_token`, {
          method: "POST",
          headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ p_token: token }),
        });
        const data = await res.json();
        if (!data?.found) {
          showState("❌", "No longer available", "This meal passport link has been deactivated or does not exist.");
          return;
        }
        let lang = data.lang && DATA.MADPAS_LANGUAGES.some(l => l.code === data.lang) ? data.lang : "en";
        renderLangSelect(lang, (newLang) => { lang = newLang; renderPassport(data, lang); });
        renderPassport(data, lang);
      } catch {
        showState("⚠️", "Something went wrong", "Please check your connection and try again.");
      }
    })();
  </script>
