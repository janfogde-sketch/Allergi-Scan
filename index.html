<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EatSafe</title>
    <meta name="description" content="Scan. Tjek. Spis trygt. Din personlige allergiguide." />
    <meta name="theme-color" content="#232528" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="privacy-policy" href="https://eatsafe.dk/privacy.html" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EatSafe" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="EatSafe" />
    <meta property="og:description" content="Scan. Tjek. Spis trygt." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://eatsafe.dk/brand/EatSafe_Logo_Horizontal_2400.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Efter et deploy findes gamle hash-navne på kode-chunks ikke længere.
      // Genindlæs én gang (højst hvert 60. sekund) for at hente den nye version.
      window.addEventListener('vite:preloadError', (event) => {
        try {
          const last = Number(sessionStorage.getItem('chunkReloadAt') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('chunkReloadAt', String(Date.now()));
        } catch { return; }
        event.preventDefault();
        window.location.reload();
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
        // sw.js bruger skipWaiting + clients.claim() til at overtage med det
        // samme i stedet for at vente på at gamle faner lukkes. Det udløser et
        // "controllerchange"-event — genindlæs én gang, så siden er sikker på
        // at køre under den nyeste service worker (bl.a. relevant for om
        // browseren regner appen som installerbar).
        let refreshedForSw = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshedForSw) return;
          refreshedForSw = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
